[project]
name = "zdisamar"
version = "0.0.10"
description = "Oxygen A-band radiative-transfer model with Python bindings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "zdisamar contributors" },
]
keywords = [
    "atmospheric-science",
    "oxygen-a-band",
    "radiative-transfer",
    "remote-sensing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Zig",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = []

[project.urls]
Repository = "https://github.com/bout3fiddy/zdisamar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "altair>=6",
    "basedpyright>=1.22",
    "hatchling>=1.29",
    "numpy>=2.0,<3",
    "pandas>=2.3",
    "polars>=1.36",
    "ruff>=0.15",
    "ty>=0.0.1a1",
]

[tool.hatch.build.targets.wheel]
packages = ["python/zdisamar"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"data/reference_data" = "zdisamar/reference_data/assets"

[tool.hatch.build.targets.sdist]
include = [
    "python/zdisamar",
    "data/reference_data",
    "hatch_build.py",
    "pyproject.toml",
    "uv.lock",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    "vendor",
    "out",
    "zig-out",
    ".zig-cache",
    "docs/workpackages",
    "validation/.cache",
    "validation/function_diff",
    "validation/latest",
    "validation/runs",
    "validation/scratch",
    "validation/tmp",
    "validation/work",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
]
