[project]
name = "zdisamar"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "altair>=5.5",
    "numpy>=2.2",
    "pandas>=2.2",
    "polars>=1.35",
    "vl-convert-python>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.22",
    "hatchling>=1.29",
    "ruff>=0.15",
    "ty>=0.0.1a1",
]

[tool.hatch.build.targets.wheel]
packages = ["python/zdisamar"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"data/reference_data" = "zdisamar/reference_data/assets"
"python/zdisamar/bindings" = "zdisamar/bindings"

[tool.hatch.build.targets.sdist]
include = [
    "python/zdisamar",
    "data/reference_data",
    "hatch_build.py",
    "pyproject.toml",
    "uv.lock",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    "vendor",
    "out",
    "zig-out",
    ".zig-cache",
    "docs/workpackages",
    "validation/.cache",
    "validation/function_diff",
    "validation/latest",
    "validation/runs",
    "validation/scratch",
    "validation/tmp",
    "validation/work",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
]
