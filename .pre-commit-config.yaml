default_language_version:
  python: python3.14

exclude: |
  (?x)^(
    vendor/.*|
    out/.*|
    zig-out/.*|
    \.zig-cache/.*|
    data/reference_data/.*|
    docs/workpackages/.*|
    validation/(\.cache|function_diff|latest|runs|scratch|tmp|work)/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-toml
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.10
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run --group dev basedpyright
        language: system
        types: [python]
        pass_filenames: false

      - id: ty
        name: ty (preview, advisory)
        # Preview tool — output is shown but never blocks the commit.
        # Drop the `; true` once ty is stable enough to gate on.
        entry: sh -c 'uv run --group dev ty check; true'
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

      - id: zig-fmt
        name: zig fmt
        entry: zig fmt --check
        language: system
        files: '\.(zig|zon)$'
